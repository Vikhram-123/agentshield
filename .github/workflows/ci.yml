# Run the test suite on every push and pull request, on each supported Python.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Installs and runs as a command
        run: |
          python -m pip install --quiet .
          agentshield --version
          agentshield scan --diff tests/fixtures/ai_pr.diff --offline --fail-on never
